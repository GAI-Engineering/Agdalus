[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
  "evaluation: bounded resource evaluation rather than a functional unit test",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["backend", "scripts"]
exclude = ["backend/tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
